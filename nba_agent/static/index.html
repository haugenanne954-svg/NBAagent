<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   NBA AGENT — HARD-COURT EDITORIAL
   Dark basketball court aesthetic, bold typography,
   magazine-style layout with orange accent
   ═══════════════════════════════════════════════ */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg:          #0a0a0b;
  --bg-elevated: #131316;
  --bg-card:     #1a1a1f;
  --bg-hover:    #222228;
  --fg:          #e8e6e3;
  --fg-dim:      #8a8890;
  --fg-muted:    #5c5a62;
  --accent:      #e85d26;
  --accent-glow: rgba(232, 93, 38, 0.15);
  --accent-dim:  #c44d1e;
  --green:       #2dd4a0;
  --green-dim:   rgba(45, 212, 160, 0.12);
  --border:      #2a2a30;
  --border-dim:  #1e1e24;
  --radius:      6px;
  --font-display: 'Oswald', 'Noto Sans SC', sans-serif;
  --font-body:    'Noto Sans SC', system-ui, sans-serif;
  --font-mono:    'IBM Plex Mono', 'Menlo', monospace;
}

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.6;
  overflow: hidden;
  height: 100vh;
}

/* ── Scrollbar ──────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

/* ── Layout ─────────────────────────────────── */
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ───────────────────────────────── */
.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border-dim);
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease;
}

.sidebar-header {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border-dim);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  background: var(--accent);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  letter-spacing: -0.5px;
}

.brand-text {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--fg);
}

.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 16px;
  padding: 10px 14px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--fg-dim);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.new-chat-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

.new-chat-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
}

.sidebar-chats {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
}

.chat-item:hover {
  background: var(--bg-hover);
}

.chat-item.active {
  background: var(--accent-glow);
  border: 1px solid rgba(232, 93, 38, 0.2);
}

.chat-item-text {
  flex: 1;
  font-size: 13px;
  color: var(--fg-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-item.active .chat-item-text {
  color: var(--fg);
}

.chat-item-time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
}

.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}

.status-dot.offline {
  background: var(--fg-muted);
  box-shadow: none;
}

.status-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  letter-spacing: 0.5px;
}

/* ── Main Area ─────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* ── Header ─────────────────────────────────── */
.main-header {
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-dim);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10, 10, 11, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: relative;
  z-index: 10;
}

.main-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 28px;
  right: 28px;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent 60%);
  opacity: 0.3;
}

.header-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--fg-dim);
}

.header-actions {
  display: flex;
  gap: 6px;
}

.header-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg-dim);
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.header-btn:hover {
  border-color: var(--fg-muted);
  color: var(--fg);
}

.header-btn svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
}

/* ── Messages ──────────────────────────────── */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  scroll-behavior: smooth;
}

.messages-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  text-align: center;
  padding: 40px;
}

.empty-icon {
  font-family: var(--font-display);
  font-size: 120px;
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  opacity: 0.08;
  letter-spacing: -5px;
  user-select: none;
}

.empty-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--fg);
  margin-top: -20px;
}

.empty-sub {
  font-size: 14px;
  color: var(--fg-muted);
  margin-top: 10px;
  max-width: 420px;
}

.empty-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 28px;
  justify-content: center;
  max-width: 600px;
}

.suggestion-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--fg-dim);
  cursor: pointer;
  transition: all 0.2s;
}

.suggestion-chip:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

/* ── Message Bubbles ───────────────────────── */
.msg {
  margin-bottom: 24px;
  display: flex;
  gap: 12px;
  animation: msgIn 0.3s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-avatar {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.msg.user .msg-avatar {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg-dim);
}

.msg.assistant .msg-avatar {
  background: var(--accent);
  color: #fff;
}

.msg-body {
  flex: 1;
  min-width: 0;
}

.msg-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.msg-name {
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.msg.user .msg-name { color: var(--fg-dim); }
.msg.assistant .msg-name { color: var(--accent); }

.msg-time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
}

.msg-content {
  font-size: 14px;
  line-height: 1.75;
  color: var(--fg);
}

.msg.user .msg-content {
  color: var(--fg-dim);
}

/* Markdown in messages */
.msg-content h1, .msg-content h2, .msg-content h3 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.5px;
  margin: 16px 0 8px;
  color: var(--fg);
}

.msg-content h1 { font-size: 20px; }
.msg-content h2 { font-size: 17px; }
.msg-content h3 { font-size: 15px; }

.msg-content p {
  margin: 6px 0;
}

.msg-content strong {
  color: var(--fg);
  font-weight: 600;
}

.msg-content em {
  color: var(--accent);
  font-style: normal;
}

.msg-content code {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

.msg-content pre {
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 10px 0;
  overflow-x: auto;
}

.msg-content pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: 12px;
  color: var(--fg);
}

.msg-content ul, .msg-content ol {
  padding-left: 20px;
  margin: 6px 0;
}

.msg-content li {
  margin: 3px 0;
}

.msg-content li::marker {
  color: var(--accent);
}

.msg-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 14px;
  margin: 10px 0;
  color: var(--fg-dim);
}

.msg-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
}

.msg-content th, .msg-content td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
}

.msg-content th {
  background: var(--bg-card);
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-size: 11px;
  color: var(--fg-dim);
}

.msg-content td {
  color: var(--fg);
}

/* ── Agent Pipeline Indicator ──────────────── */
.pipeline {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: var(--radius);
  animation: msgIn 0.3s ease-out;
}

.pipeline-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-right: 6px;
}

.pipeline-step {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 3px;
  background: var(--bg);
  border: 1px solid var(--border-dim);
  color: var(--fg-muted);
  transition: all 0.3s;
}

.pipeline-step.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-glow);
}

.pipeline-step.done {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-dim);
}

.pipeline-arrow {
  color: var(--fg-muted);
  font-size: 10px;
  opacity: 0.4;
}

/* ── Typing Indicator ──────────────────────── */
.typing {
  display: flex;
  gap: 4px;
  padding: 8px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── Input Area ────────────────────────────── */
.input-area {
  padding: 16px 28px 24px;
  border-top: 1px solid var(--border-dim);
  background: var(--bg);
  position: relative;
}

.input-area::before {
  content: '';
  position: absolute;
  top: 0;
  left: 28px;
  right: 28px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.input-area:focus-within::before {
  opacity: 0.4;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 4px 4px 16px;
  transition: border-color 0.2s;
}

.input-wrap:focus-within {
  border-color: var(--accent);
}

.input-wrap textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  max-height: 120px;
  padding: 8px 0;
}

.input-wrap textarea::placeholder {
  color: var(--fg-muted);
}

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.send-btn:hover {
  background: var(--accent-dim);
}

.send-btn:disabled {
  background: var(--bg-hover);
  color: var(--fg-muted);
  cursor: not-allowed;
}

.send-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
}

.input-hint {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding: 0 4px;
}

.input-hint span {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg-muted);
  letter-spacing: 0.3px;
}

.input-hint kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border-dim);
  border-radius: 3px;
  padding: 0 4px;
  color: var(--fg-dim);
}

/* ── Responsive ────────────────────────────── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    z-index: 100;
    height: 100vh;
    transform: translateX(-100%);
  }
  .sidebar.open {
    transform: translateX(0);
    box-shadow: 4px 0 30px rgba(0,0,0,0.5);
  }
  .messages { padding: 16px; }
  .input-area { padding: 12px 16px 20px; }
  .empty-icon { font-size: 72px; }
  .empty-title { font-size: 22px; }
}

/* ── Court texture overlay ─────────────────── */
.main::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(232, 93, 38, 0.03) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(232, 93, 38, 0.02) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

.messages, .input-area, .main-header {
  position: relative;
  z-index: 1;
}

/* ── Mobile menu toggle ────────────────────── */
.menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--fg-dim);
  cursor: pointer;
  padding: 4px;
}

.menu-toggle svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
}

@media (max-width: 768px) {
  .menu-toggle { display: flex; }
}

/* ── Overlay for mobile sidebar ────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 99;
}

.overlay.active {
  display: block;
}
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ──────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">24</div>
        <div>
          <div class="brand-text">NBA Agent</div>
          <div class="brand-sub">Multi-Agent System</div>
        </div>
      </div>
      <button class="new-chat-btn" onclick="newChat()" title="新对话">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新对话
      </button>
    </div>
    <div class="sidebar-chats" id="chatList"></div>
    <div class="sidebar-footer">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Ready</span>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- ── Main ─────────────────────────────── -->
  <div class="main">
    <header class="main-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="header-title" id="headerTitle">New Session</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" onclick="clearChat()" title="清空当前对话">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
          Clear
        </button>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="messages-empty" id="emptyState">
        <div class="empty-icon">NBA</div>
        <div class="empty-title">Ask The Court</div>
        <div class="empty-sub">数据查询、资讯搜索、薪资分析、交易评估、战术分析、比赛预测 — 一站式 NBA 智能助手</div>
        <div class="empty-suggestions">
          <button class="suggestion-chip" onclick="askSuggestion(this)">湖人最近战绩怎么样？</button>
          <button class="suggestion-chip" onclick="askSuggestion(this)">什么是 Bird Rights？</button>
          <button class="suggestion-chip" onclick="askSuggestion(this)">雷霆为什么防守强？</button>
          <button class="suggestion-chip" onclick="askSuggestion(this)">勇士薪资状况如何？</button>
          <button class="suggestion-chip" onclick="askSuggestion(this)">东契奇和约基奇谁更强？</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入你的 NBA 问题..." 
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <span>Supervisor + 4 Agents &middot; LangGraph</span>
        <span><kbd>Enter</kbd> 发送 &middot; <kbd>Shift+Enter</kbd> 换行</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   NBA AGENT — Frontend Logic
   ═══════════════════════════════════════════════ */

// ── State ────────────────────────────────────
let threadId = generateId();
let isProcessing = false;
let chatHistory = [];

// ── DOM ──────────────────────────────────────
const $messages  = document.getElementById('messages');
const $input    = document.getElementById('input');
const $sendBtn  = document.getElementById('sendBtn');
const $empty    = document.getElementById('emptyState');
const $chatList = document.getElementById('chatList');
const $header   = document.getElementById('headerTitle');

// ── Init ─────────────────────────────────────
loadChats();
$input.focus();

// ── Helpers ──────────────────────────────────
function generateId() {
  return 'web-' + Math.random().toString(36).slice(2, 10);
}

function timeNow() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Chat Storage ─────────────────────────────
function loadChats() {
  try {
    chatHistory = JSON.parse(localStorage.getItem('nba_chats') || '[]');
  } catch { chatHistory = []; }
  renderChatList();
}

function saveChats() {
  localStorage.setItem('nba_chats', JSON.stringify(chatHistory.slice(0, 50)));
}

function renderChatList() {
  $chatList.innerHTML = chatHistory.map((c, i) => `
    <div class="chat-item ${c.id === threadId ? 'active' : ''}" onclick="switchChat('${c.id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      <span class="chat-item-text">${escapeHtml(c.title)}</span>
      <span class="chat-item-time">${c.time || ''}</span>
    </div>
  `).join('');
}

function updateChatTitle(title) {
  let chat = chatHistory.find(c => c.id === threadId);
  if (chat) {
    chat.title = title;
  } else {
    chatHistory.unshift({
      id: threadId,
      title: title,
      time: timeNow(),
      messages: []
    });
    chat = chatHistory[0];
  }
  saveChats();
  renderChatList();
}

function switchChat(id) {
  threadId = id;
  $header.textContent = chatHistory.find(c => c.id === id)?.title || 'New Session';
  renderChatList();
  closeSidebar();
  // For simplicity, just switch thread. Full history reload would need /api/history
}

function newChat() {
  threadId = generateId();
  $header.textContent = 'New Session';
  $messages.innerHTML = '';
  $messages.appendChild(createEmptyState());
  renderChatList();
  closeSidebar();
  $input.focus();
}

function clearChat() {
  $messages.innerHTML = '';
  $messages.appendChild(createEmptyState());
}

function createEmptyState() {
  const div = document.createElement('div');
  div.className = 'messages-empty';
  div.id = 'emptyState';
  div.innerHTML = `
    <div class="empty-icon">NBA</div>
    <div class="empty-title">Ask The Court</div>
    <div class="empty-sub">数据查询、资讯搜索、薪资分析、交易评估、战术分析、比赛预测</div>
    <div class="empty-suggestions">
      <button class="suggestion-chip" onclick="askSuggestion(this)">湖人最近战绩怎么样？</button>
      <button class="suggestion-chip" onclick="askSuggestion(this)">什么是 Bird Rights？</button>
      <button class="suggestion-chip" onclick="askSuggestion(this)">雷霆为什么防守强？</button>
      <button class="suggestion-chip" onclick="askSuggestion(this)">勇士薪资状况如何？</button>
    </div>
  `;
  return div;
}

// ── Sidebar Mobile ───────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

// ── Message Rendering ────────────────────────
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function renderMarkdown(text) {
  // Simple markdown → HTML
  let html = escapeHtml(text);

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic (but not inside bold)
  html = html.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered list
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Ordered list
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Table
  html = html.replace(/\|(.+)\|/g, (match) => {
    const cells = match.split('|').filter(c => c.trim());
    if (cells.every(c => /^[\s-:]+$/.test(c))) return ''; // separator row
    return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
  });
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  // Clean up
  html = html.replace(/<p>(<h[1-3]>)/g, '$1');
  html = html.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<pre>)/g, '$1');
  html = html.replace(/(<\/pre>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  html = html.replace(/<p>(<blockquote>)/g, '$1');
  html = html.replace(/(<\/blockquote>)<\/p>/g, '$1');
  html = html.replace(/<p>(<tr>)/g, '<table>$1');
  html = html.replace(/(<\/tr>)<\/p>/g, '$1</table>');

  return html;
}

function addMessage(role, content, extra) {
  // Remove empty state
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatarText = role === 'user' ? 'U' : '24';
  const nameText = role === 'user' ? 'You' : 'NBA Agent';

  let bodyHtml = '';
  if (extra?.pipeline) {
    bodyHtml += renderPipeline(extra.pipeline, extra.visited);
  }
  bodyHtml += `<div class="msg-content">${role === 'assistant' ? renderMarkdown(content) : escapeHtml(content)}</div>`;

  div.innerHTML = `
    <div class="msg-avatar">${avatarText}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name">${nameText}</span>
        <span class="msg-time">${timeNow()}</span>
      </div>
      ${bodyHtml}
    </div>
  `;

  $messages.appendChild(div);
  scrollToBottom();
  return div;
}

function addStreamingMessage() {
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'streaming-msg';
  div.innerHTML = `
    <div class="msg-avatar">24</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name">NBA Agent</span>
        <span class="msg-time">${timeNow()}</span>
      </div>
      <div id="pipeline-area"></div>
      <div class="msg-content" id="streaming-content">
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;

  $messages.appendChild(div);
  scrollToBottom();
  return div;
}

function renderPipeline(plan, visited) {
  if (!plan || plan.length === 0) return '';

  const labels = {
    data: 'Data',
    news: 'News',
    salary: 'Salary',
    analysis: 'Analysis'
  };

  const steps = plan.map((step, i) => {
    const isDone = visited && visited.includes(step);
    const isActive = visited && !isDone && visited.length === i;
    const cls = isDone ? 'done' : (isActive ? 'active' : '');
    const icon = isDone ? '&#10003;' : (isActive ? '&#9654;' : '&#9675;');
    return `<span class="pipeline-step ${cls}">${icon} ${labels[step] || step}</span>`;
  }).join('<span class="pipeline-arrow">&rarr;</span>');

  return `<div class="pipeline"><span class="pipeline-label">Pipeline</span>${steps}</div>`;
}

function updatePipeline(plan, visited) {
  const area = document.getElementById('pipeline-area');
  if (area) {
    area.innerHTML = renderPipeline(plan, visited);
  }
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    $messages.scrollTop = $messages.scrollHeight;
  });
}

// ── Send Message ─────────────────────────────
async function sendMessage() {
  const query = $input.value.trim();
  if (!query || isProcessing) return;

  isProcessing = true;
  $sendBtn.disabled = true;
  $input.value = '';
  autoResize($input);

  // Show user message
  addMessage('user', query);
  updateChatTitle(query.slice(0, 40));

  // Prepare streaming message
  addStreamingMessage();

  // Set status
  setStatus('processing', 'Processing...');

  try {
    // Use SSE streaming
    await streamQuery(query);
  } catch (err) {
    console.error('Stream error:', err);
    // Fallback to sync
    try {
      await syncQuery(query);
    } catch (err2) {
      console.error('Sync error:', err2);
      const content = document.getElementById('streaming-content');
      if (content) content.textContent = 'Error: ' + (err2.message || 'Unknown error');
    }
  }

  isProcessing = false;
  $sendBtn.disabled = false;
  $input.focus();
  setStatus('ready', 'Ready');
}

async function streamQuery(query) {
  const url = `/api/stream?query=${encodeURIComponent(query)}&thread_id=${encodeURIComponent(threadId)}`;
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let plan = [];
  let visited = [];
  let answerParts = [];

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });

    // Parse SSE events
    const lines = buffer.split('\n');
    buffer = '';

    let currentEvent = '';
    let currentData = '';

    for (const line of lines) {
      if (line.startsWith('event: ')) {
        currentEvent = line.slice(7).trim();
      } else if (line.startsWith('data: ')) {
        currentData = line.slice(6);
        // Unescape newlines
        currentData = currentData.replace(/\\n/g, '\n');

        // Process the event
        switch (currentEvent) {
          case 'plan':
            try {
              const planData = JSON.parse(currentData);
              plan = planData.plan || [];
              updatePipeline(plan, visited);
            } catch {}
            break;

          case 'agent_done':
            try {
              const agentData = JSON.parse(currentData);
              visited.push(agentData.agent);
              updatePipeline(plan, visited);
            } catch {}
            break;

          case 'answer':
            answerParts.push(currentData);
            const content = document.getElementById('streaming-content');
            if (content) {
              content.innerHTML = renderMarkdown(answerParts.join(''));
            }
            scrollToBottom();
            break;

          case 'status':
            setStatus('processing', currentData);
            break;

          case 'done':
            // Finalize
            break;

          case 'error':
            const errContent = document.getElementById('streaming-content');
            if (errContent) {
              errContent.textContent = 'Error: ' + currentData;
            }
            break;
        }

        currentEvent = '';
        currentData = '';
      } else if (line.trim() === '') {
        // Empty line = end of event
        continue;
      } else {
        // Continuation or unknown - append to buffer
        buffer += line + '\n';
      }
    }
  }

  // Final cleanup
  const streamingMsg = document.getElementById('streaming-msg');
  if (streamingMsg) streamingMsg.removeAttribute('id');
}

async function syncQuery(query) {
  const response = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, thread_id: threadId }),
  });

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  const data = await response.json();

  if (data.error) {
    throw new Error(data.error);
  }

  // Update pipeline
  updatePipeline(data.plan || [], data.visited || []);

  // Update content
  const content = document.getElementById('streaming-content');
  if (content) {
    content.innerHTML = renderMarkdown(data.answer || '');
  }

  // Update thread ID
  if (data.thread_id) threadId = data.thread_id;

  // Remove streaming id
  const streamingMsg = document.getElementById('streaming-msg');
  if (streamingMsg) streamingMsg.removeAttribute('id');

  scrollToBottom();
}

function askSuggestion(btn) {
  $input.value = btn.textContent;
  sendMessage();
}

// ── Status ───────────────────────────────────
function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusText');
  dot.className = 'status-dot' + (state === 'ready' ? '' : ' offline');
  if (state === 'processing') {
    dot.style.background = 'var(--accent)';
    dot.style.boxShadow = '0 0 6px var(--accent)';
  } else {
    dot.style.background = '';
    dot.style.boxShadow = '';
  }
  label.textContent = text;
}
</script>

</body>
</html>
